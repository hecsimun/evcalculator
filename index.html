<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV vs Fuel Savings Calculator</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#1f2937;
}

.language-select{
    text-align:right;
    margin-bottom:20px;
}

select{
    padding:8px;
    border-radius:8px;
    border:1px solid #ccc;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    color:#333;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    background:#16a34a;
    color:white;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#15803d;
}

.results{
    display:none;
    margin-top:25px;
    background:#eefaf0;
    padding:20px;
    border-radius:12px;
}

.result-item{
    margin-bottom:10px;
    font-size:18px;
}

.savings{
    font-size:24px;
    color:#16a34a;
    font-weight:bold;
    margin-top:15px;
}
</style>
</head>

    <select id="language" onchange="changeLanguage()">

        <option value="hr">🇭🇷 Hrvatski</option>
    </select>
</div>

<h1 id="title">EV vs Fuel Savings Calculator</h1>
